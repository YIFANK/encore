  # own success verification (watched happen, 2026-08-10).
  wall_clock_s: 900
  verify_max_age_s: 25
models:
  er_model: gemini-robotics-er-2-preview
  thinking_ground: minimal
  thinking_verify: low
  thinking_plan: low
  thinking_repair: low
disable_skills:
- tamp_pick
- tamp_place
- vla
episodes_dir: episodes
memory_dir: memory_store
grounding_mode: point
active_arms: [right]
grasp_service_url: null

# Operator dialogue: brief before motion, corrections replan
interactive: true
speak: true
